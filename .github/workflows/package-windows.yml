name: package-windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/needle-app/web/package-lock.json
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: 1.90.0
          components: clippy, rustfmt
      - name: Validate and build embedded web control plane
        working-directory: crates/needle-app/web
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run lint
          npm run build
      - name: Validate and build Needle
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
          cargo build --locked --release -p needle-app
      - name: Assemble portable installer archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist/needle-windows-x64 | Out-Null
          Copy-Item target/release/needle.exe dist/needle-windows-x64/needle.exe
          Copy-Item packaging/windows/install.ps1 dist/needle-windows-x64/install.ps1
          Copy-Item packaging/windows/uninstall.ps1 dist/needle-windows-x64/uninstall.ps1
          Copy-Item LICENSE.md dist/needle-windows-x64/LICENSE.md
          Copy-Item docs/INSTALLATION.md dist/needle-windows-x64/README.md
          Compress-Archive -Path dist/needle-windows-x64/* -DestinationPath dist/needle-windows-x64.zip
          (Get-FileHash dist/needle-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant() |
            Set-Content -NoNewline dist/needle-windows-x64.zip.sha256
      - name: Verify final Windows package
        shell: pwsh
        run: |
          $verificationDirectory = Join-Path $env:RUNNER_TEMP "needle-package-verification"
          ./packaging/windows/verify-package.ps1 `
            -Archive dist/needle-windows-x64.zip `
            -ChecksumFile dist/needle-windows-x64.zip.sha256 `
            -WorkDirectory $verificationDirectory `
            -Repository $PWD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: needle-windows-x64
          path: |
            dist/needle-windows-x64.zip
            dist/needle-windows-x64.zip.sha256
          if-no-files-found: error
